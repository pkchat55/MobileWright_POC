name: Android tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PageObjectModelMW
    env:
      MOBILEWRIGHT_DEVICE_NAME: ci-android-emulator

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PageObjectModelMW/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Android tests
        id: android-tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: ci-android-emulator
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set +e
            npm run test:android > test-output.log 2>&1
            test_exit_code=$?
            cat test-output.log
            mkdir -p ai-dashboard
            adb exec-out screencap -p > ai-dashboard/emulator-final-state.png || true
            exit $test_exit_code

      - name: Generate AI failure dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run report:ai

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-report
          path: PageObjectModelMW/mobilewright-report
          if-no-files-found: ignore

      - name: Upload AI dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-ai-dashboard
          path: PageObjectModelMW/ai-dashboard
          if-no-files-found: error

      - name: Mark test failure
        if: steps.android-tests.outcome == 'failure'
        run: exit 1