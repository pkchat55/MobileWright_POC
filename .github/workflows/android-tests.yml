name: Android tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PageObjectModelMW
    env:
      MOBILEWRIGHT_DEVICE_NAME: ci-android-emulator

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PageObjectModelMW/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: ci-android-emulator
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: npm run test:android

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-report
          path: PageObjectModelMW/mobilewright-report
          if-no-files-found: ignore